name: tekartik_cmd_tools
description: Linux command line tools
version: 0.4.0
homepage: https://github.com/tekartik/cmd_tools.dart

publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  args: ">=2.7.0"
  tekartik_app_csv:
    git:
      url: https://github.com/tekartik/app_common_utils.dart
      path: app_csv
    version: '>=0.1.0'
  glob: ">=2.1.3"
  tekartik_io_utils:
    git:
      url: https://github.com/tekartik/io_utils.dart
  tekartik_common_utils:
    git:
      url: https://github.com/tekartik/common_utils.dart
  process_run: ">=1.2.4"

dev_dependencies:
  test: ">=1.26.3"
  dev_build: ">=1.1.2+11"
resolution: workspace

